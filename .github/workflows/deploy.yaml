name: Deploy Reusable Workflow

on:
  workflow_call:

jobs:
  deploy:
    name: Deploy no Kubernetes Local
    runs-on: self-hosted
    steps:
      - name: Obtendo o código do projeto
        uses: actions/checkout@v4

      - name: Aplicar manifestos no Kubernetes
        run: |
          kubectl apply -f k8s/
          kubectl rollout restart deployment/review-filmes -n default

      - name: Verificar status do rollout
        run: |
          kubectl rollout status deployment/review-filmes -n default
