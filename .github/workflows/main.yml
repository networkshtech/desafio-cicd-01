name: Pipeline CI/CD
run-name: Pipeline CI/CD executada por ${{ github.actor }} em ${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Obtendo o código do projeto
        uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.300"

      - name: Execução do comando build
        working-directory: ./src
        run: dotnet build Review-Filmes.sln
  
  testes:
    needs: [build]
    uses: networkshtech/desafio-cicd-01/.github/workflows/testes.yaml@main
    secrets: inherit

  release:
    needs: [testes]
    name: Criação de release
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    
    steps:
      - name: Obtendo o código do projeto
        uses: actions/checkout@v4
     
      - name: Analise do Dockerfile
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: ./src/Review-Filmes.Web/Dockerfile
      
      - name: Efetuando o Login no Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_PWD}}
      
      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v7.4.0
        with:
          push: true
          context: ./src
          file: ./src/Review-Filmes.Web/Dockerfile
          tags: |
            networkshtech/desafio-cicd:latest
            networkshtech/desafio-cicd:v${{ github.run_number }}
      
      - name: Executar o Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: networkshtech/desafio-cicd:v${{ github.run_number }}
          format: sarif
          output: trivy-docker-result.sarif
          severity: 'MEDIUM,HIGH,CRITICAL'

      - name: Upload do arquivo trivy para o Github
        uses: github/codeql-action/upload-sarif@v4
        with:
          category: docker-result
          sarif_file: trivy-docker-result.sarif

      deploy:
      needs: [release]
      uses: networkshtech/desafio-cicd-01/.github/workflows/deploy.yaml@main
      secrets: inherit
            
            
        
            

