
# Deploy do PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgre
  template:
    metadata:
      labels:
        app: postgre
    spec:
      containers:
        - name: postgre
          image: postgres:13.1
          env:
            - name: POSTGRES_PASSWORD
              value: "Passw0rd2024!"
            - name: POSTGRES_USER
              value: "reviewfilmes"
            - name: POSTGRES_DB
              value: "reviewfilmes"
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: postgre
spec:
  type: ClusterIP
  selector:
    app: postgre
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
# Deploy da Aplicação Web
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviewfilmes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reviewfilmes
  template:
    metadata:
      labels:
        app: reviewfilmes
    spec:
      containers:
        - name: reviewfilmes
          image: networkshtech/desafio-cicd:latest
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgre;Database=reviewfilmes;Username=reviewfilmes;Password=Passw0rd2024!"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: reviewfilmes
spec:
  type: ClusterIP
  selector:
    app: reviewfilmes
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
# Ingress Traefik
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reviewfilmes
spec:
  ingressClassName: traefik
  rules:
    - host: homologacao.networkshtech.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reviewfilmes
                port:
                  number: 80
